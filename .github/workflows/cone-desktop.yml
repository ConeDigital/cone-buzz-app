name: Cone Desktop

# The Cone Desktop on Buzz 1.0 (cone-buzz-infra
# slices/48-cone-desktop-on-buzz-app.md, ADR-340 as amended by ADR-353).
#
# Every pull request to `cone` and every push to it proves the fork shallow
# (criterion 2) and the build's configuration exactly cone/build.env, and runs
# the release scripts' tests.
#
# A tag cone-desktop-vX.Y.Z on `cone` builds Apple silicon and Intel with
# `just cone-desktop-build`, signs the app and every executable it bundles
# with Cone's Developer ID (cone/sign-nested.sh for the helpers Tauri leaves
# unsigned), notarizes and staples the app and the DMG, and publishes both
# DMGs as a GitHub Release with the updater archive of each, made again from
# the stapled app and signed with the updater key (cone/updater-archive.sh).
#
# A release reaches installed apps only when it is promoted: a
# workflow_dispatch with `promote` set to its tag verifies the release's
# archives against cone/updater.pub, writes latest.json and uploads it to the
# bucket object 2/latest.json behind
# https://buzz.cone.digital/desktop/2/latest.json. The old app's feed (the
# bucket root's latest.json, /desktop/latest.json) is never written, and its
# bytes are compared before and after (criterion 4).
#
# Apple can take hours (Slice 29 defect 225), so a release is resumable: each
# build's state is saved as two artifacts in every run, and when Apple is
# still working at the deadline the run ends with the command that resumes it
# (cone/release-advance.sh).
#
# Every secret is in the environment cone-release: deployments only from
# cone-desktop-v* tags, the owner a required reviewer, so each run — a resume
# too — waits for the owner's approval. A dispatch from a branch is refused
# there (criterion 3). Every upstream workflow stays disabled in this fork.
#
# The Windows check (cone-buzz-infra Slice 38, merge 3a of Slice 48): a
# dispatch with `windows_check` set to a version builds an unsigned Windows
# x86_64 NSIS installer of that version on windows-2025, from any branch, with
# no environment and no secret — the rebrand's mutation test and check on
# Windows, cone/windows-build.sh, a silent install on the runner checked for
# Cone's name, publisher, version, identifier, helpers and updater — and keeps
# it 7 days as the artifact cone-desktop-windows-x64-unsigned.

on:
  pull_request:
    branches: [cone]
  push:
    branches: [cone]
    tags:
      - 'cone-desktop-v*'
  # Exactly one input per dispatch: resume_run_id resumes a release and
  # promote publishes one, both on a cone-desktop-v* tag (the environment
  # refuses a branch); windows_check builds the unsigned Windows installer
  # from any ref, outside the environment.
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: Resume — the run of this workflow, on this tag, to resume
        required: false
        default: ''
      promote:
        description: Promote — the release tag (cone-desktop-vX.Y.Z) installed apps update to
        required: false
        default: ''
      windows_check:
        description: Windows check — build an unsigned Windows installer as this version (X.Y.Z or X.Y.Z-pre); no secrets
        required: false
        default: ''

# A group keeps one run going and only ONE pending: a newer run replaces a
# pending one even with cancel-in-progress false. So a Windows check has its
# own group, cone-desktop-windows-check-<ref>, which can never equal a
# release's, resume's or promote's cone-desktop-<ref> (a ref starts with
# refs/) and so never displaces one; every other run's group is unchanged.
concurrency:
  group: cone-desktop-${{ github.event_name == 'workflow_dispatch' && inputs.windows_check != '' && 'windows-check-' || '' }}${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  shallow:
    name: Shallow fork
    if: github.event_name != 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      # The base of the shallowness check comes from block/buzz-app itself,
      # not from this fork, where a moved tag could hide a deeper diff.
      - name: Fetch the pinned upstream tag from block/buzz-app
        run: |
          set -euo pipefail
          base="$(tr -d '[:space:]' < cone/UPSTREAM)"
          [[ "$base" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "::error::cone/UPSTREAM holds '$base', not a stable upstream tag vX.Y.Z"; exit 1; }
          git fetch --no-tags https://github.com/block/buzz-app.git "+refs/tags/$base:refs/tags/$base"
          echo "upstream $base = $(git rev-parse "$base^{commit}")"

      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1

      - name: cone-shallow-check
        run: just cone-shallow-check

      - name: cone-build-env-check
        run: just cone-build-env-check

      # macOS: the scripts drive ditto, hdiutil and codesign (mocked).
      - name: cone-notarize-test
        run: just cone-notarize-test

      - name: cone-updater-test
        run: just cone-updater-test

      - name: cone-upstream-test
        run: just cone-upstream-test

      # The in-app rebrand (cone-buzz-infra Slice 51, ADR-364): the
      # transform's mutation test, then the exact check with the transformed
      # frontend type-checked, built and scanned — before any Rust compiles,
      # so a stale manifest row fails in minutes. The release build applies
      # the same transform (cone-desktop-build).
      - name: Frontend dependencies (the transform parses with the app's own rolldown)
        run: pnpm install --frozen-lockfile

      - name: cone-rebrand-test
        run: just cone-rebrand-test

      - name: cone-rebrand-check
        run: just cone-rebrand-check

  dispatch-inputs:
    name: Dispatch inputs
    if: >-
      github.event_name == 'workflow_dispatch' && !(
        (inputs.resume_run_id != '' && inputs.promote == '' && inputs.windows_check == '') ||
        (inputs.resume_run_id == '' && inputs.promote != '' && inputs.windows_check == '') ||
        (inputs.resume_run_id == '' && inputs.promote == '' && inputs.windows_check != ''))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          echo "::error::a dispatch takes exactly one of resume_run_id, promote and windows_check"
          exit 1

  # The unsigned Windows x86_64 installer (cone-buzz-infra Slice 38 decision
  # 4's windows-check, on the Buzz 1.0 base): no environment, no secret, read
  # access only. The toolchain and the install check follow upstream's own
  # Windows job (desktop-build.yml, job windows), its action pins included;
  # Hermit and just do not run on Windows, so the build is
  # cone/windows-build.sh in Git Bash.
  windows-check:
    name: Windows check (unsigned)
    if: github.event_name == 'workflow_dispatch' && inputs.windows_check != '' && inputs.resume_run_id == '' && inputs.promote == ''
    runs-on: windows-2025
    timeout-minutes: 150
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ inputs.windows_check }}
      CARGO_TERM_COLOR: always
    steps:
      # The rebrand's manifests pin upstream files by hash and text by exact
      # match: the checkout must be byte for byte the commit's, so no CRLF
      # conversion (the runner's Git for Windows converts by default).
      - name: Check out with the commit's line endings
        run: |
          git --version
          echo "core.autocrlf on the runner: $(git config --show-origin --get core.autocrlf || echo unset)"
          git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read repository tool pins
        id: pins
        shell: pwsh
        run: |
          foreach ($tool in @('node', 'pnpm')) {
            $pins = @(Get-ChildItem "bin/.$tool-*.pkg")
            if ($pins.Count -ne 1) { throw "Expected one $tool pin" }
            $version = $pins[0].Name -replace "^\.$tool-(.*)\.pkg$", '$1'
            "$tool=$version" >> $env:GITHUB_OUTPUT
          }
          $rust = (Select-String -Path rust-toolchain.toml -Pattern '^channel = "(.+)"$').Matches.Groups[1].Value
          if (!$rust) { throw "Expected a rust-toolchain.toml channel" }
          "rust=$rust" >> $env:GITHUB_OUTPUT
      - name: Select pinned Rust
        shell: pwsh
        env:
          RUST_VERSION: ${{ steps.pins.outputs.rust }}
        run: |
          rustup toolchain install $env:RUST_VERSION --profile minimal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "RUSTUP_TOOLCHAIN=$env:RUST_VERSION" >> $env:GITHUB_ENV
      # A check's cache, scoped to the ref that ran it; saved after a failure
      # too, so the next attempt starts warm.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: cone-windows-check
          cache-on-failure: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ steps.pins.outputs.node }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: ${{ steps.pins.outputs.pnpm }}
      - name: Frontend dependencies (the transform parses with the app's own rolldown)
        run: pnpm install --frozen-lockfile

      # The in-app rebrand on Windows (decision 2): the planted failures fail
      # here too, and the exact check passes, before any Rust compiles.
      - name: cone-rebrand-test
        run: bash cone/rebrand-test.sh
      - name: cone-rebrand-check
        run: cone/rebrand.sh check

      - name: Build the NSIS installer (cone/windows-build.sh)
        run: cone/windows-build.sh "$VERSION"

      # What a person gets: the installer run silently into a scratch folder
      # of this disposable runner, as upstream checks its own, and every Cone
      # setting read back from what it wrote. Then the uninstaller.
      - name: Install on the runner and verify
        shell: pwsh
        run: |
          $fail = [System.Collections.Generic.List[string]]::new()
          function Check([bool] $ok, [string] $what) {
            if ($ok) { Write-Output "ok   $what" } else { Write-Output "FAIL $what"; $fail.Add($what) }
          }
          $cone = Get-Content cone/tauri.cone.conf.json -Raw | ConvertFrom-Json
          $product = $cone.productName
          $identifier = $cone.identifier
          $publisher = (Get-Content cone/tauri.cone.windows.conf.json -Raw | ConvertFrom-Json).bundle.publisher
          $pubkey = (Get-Content cone/updater.pub -Raw) -replace '\s', ''
          $endpoint = (Select-String -Path cone/build.env -Pattern '^BUZZ_UPDATER_ENDPOINT=(.+)$').Matches.Groups[1].Value
          $installer = (Resolve-Path "target/release/bundle/nsis/${product}_$($env:VERSION)_x64-setup.exe").Path
          $dest = Join-Path $env:RUNNER_TEMP 'cone-install'
          # The Cone icon, frame for frame, in the setup exe (installerIcon in
          # cone/tauri.cone.windows.conf.json; NSIS's generic icon otherwise)
          # and in the app (bundle.icon): each .ico frame is a PNG copied
          # into the PE's icon resources byte for byte.
          $ico = [IO.File]::ReadAllBytes((Resolve-Path cone/icons/icon.ico).Path)
          $frames = @(for ($i = 0; $i -lt [BitConverter]::ToUInt16($ico, 4); $i++) {
            $size = if ($ico[6 + 16 * $i] -eq 0) { 256 } else { $ico[6 + 16 * $i] }
            $length = [BitConverter]::ToInt32($ico, 6 + 16 * $i + 8); $offset = [BitConverter]::ToInt32($ico, 6 + 16 * $i + 12)
            [pscustomobject]@{ Size = $size; Text = [Text.Encoding]::Latin1.GetString($ico, $offset, $length) }
          })
          $setup = [Text.Encoding]::Latin1.GetString([IO.File]::ReadAllBytes($installer))
          $found = @($frames | Where-Object { $setup.Contains($_.Text) } | ForEach-Object Size)
          Check ($found -contains 256) "the setup exe carries cone/icons/icon.ico (frames found: $($found -join ', ') px)"

          # NSIS /D must be last and unquoted.
          $process = Start-Process $installer -ArgumentList "/S /D=$dest" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "the installer exited $($process.ExitCode)" }

          Write-Output "== What the installer laid down in $dest"
          Get-ChildItem $dest -Recurse -File | Sort-Object FullName | ForEach-Object {
            '{0,12}  {1}' -f $_.Length, $_.FullName.Substring($dest.Length + 1)
          }

          # For the signed release: Tauri signs a bundled .exe only when it is
          # not signed already, so a helper someone else signed keeps that
          # signature. Information only.
          Write-Output "== Authenticode signatures (information only)"
          Get-ChildItem $dest -Recurse -Include *.exe, *.dll | Sort-Object FullName | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            '{0,-14} {1}  {2}' -f $sig.Status, $_.FullName.Substring($dest.Length + 1), $(if ($sig.SignerCertificate) { $sig.SignerCertificate.Subject } else { '' })
          }

          Write-Output "== The files"
          $exe = Join-Path $dest 'Buzz.exe'
          Check (Test-Path $exe) "the app is Buzz.exe (upstream's Cargo binary name, as Contents/MacOS/Buzz on a Mac)"
          Check (Test-Path (Join-Path $dest 'uninstall.exe')) "uninstall.exe"
          foreach ($bin in @('buzz.exe', 'goose-acp.exe', 'buzz-agent-command.exe')) {
            Check (Test-Path (Join-Path $dest "bin\$bin")) "bin\$bin"
          }
          & (Join-Path $dest 'bin\buzz.exe') --help | Out-Null
          Check ($LASTEXITCODE -eq 0) "bin\buzz.exe --help runs"

          Write-Output "== Apps & features (the uninstall entry)"
          $uninstall = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\$product"
          $entry = Get-ItemProperty -LiteralPath $uninstall -ErrorAction SilentlyContinue
          if ($entry) { $entry | Select-Object DisplayName, Publisher, DisplayVersion, InstallLocation, DisplayIcon, UninstallString, MainBinaryName | Format-List | Out-String | Write-Output }
          Check ($entry.DisplayName -eq $product) "product name '$($entry.DisplayName)' is '$product'"
          Check ($entry.Publisher -eq $publisher) "publisher '$($entry.Publisher)' is '$publisher'"
          Check ($entry.DisplayVersion -eq $env:VERSION) "version '$($entry.DisplayVersion)' is '$($env:VERSION)'"
          foreach ($block in @('Buzz Foundation', 'Buzz')) {
            Check (-not (Test-Path -LiteralPath "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\$block")) "no uninstall entry '$block' (upstream's Windows product name lost to Cone's)"
          }

          Write-Output "== The identifier and the buzz:// scheme"
          $scheme = (Get-ItemProperty -LiteralPath 'HKCU:\Software\Classes\buzz' -ErrorAction SilentlyContinue).'(default)'
          $open = (Get-ItemProperty -LiteralPath 'HKCU:\Software\Classes\buzz\shell\open\command' -ErrorAction SilentlyContinue).'(default)'
          Check ($scheme -eq "URL:$identifier protocol") "the scheme is '$scheme' (the bundle identifier $identifier)"
          Check ($open -eq "`"$exe`" `"%1`"") "buzz:// opens $open"

          Write-Output "== Shortcuts and PATH"
          $shell = New-Object -ComObject WScript.Shell
          foreach ($folder in @('Programs', 'Desktop')) {
            $lnk = Join-Path ([Environment]::GetFolderPath($folder)) "$product.lnk"
            $target = if (Test-Path $lnk) { $shell.CreateShortcut($lnk).TargetPath } else { '<absent>' }
            Check ($target -eq $exe) "$folder\$product.lnk -> $target"
          }
          $userPath = (Get-ItemProperty HKCU:\Environment).Path -split ';'
          # The merge of Cone's deltas kept upstream's bundle.windows.nsis.installerHooks.
          Check ($userPath -contains (Join-Path $dest 'bin')) "the user PATH has $dest\bin (upstream's installerHooks ran)"

          Write-Output "== The executable"
          (Get-Item $exe).VersionInfo | Select-Object ProductName, FileDescription, CompanyName, ProductVersion, FileVersion, LegalCopyright, OriginalFilename | Format-List | Out-String | Write-Output
          Check ((Get-Item $exe).VersionInfo.ProductName -eq $product) "its version resource names $product"
          $binary = [Text.Encoding]::Latin1.GetString([IO.File]::ReadAllBytes($exe))
          $found = @($frames | Where-Object { $binary.Contains($_.Text) } | ForEach-Object Size)
          Check ($found -contains 256) "Buzz.exe carries cone/icons/icon.ico (frames found: $($found -join ', ') px)"
          Check ($binary.Contains($pubkey)) "cone/updater.pub's key is compiled in"
          # The x86_64 compiler may store a short literal as 8-byte immediates
          # (Slice 29 defect 237): the whole URL, or else every 8-byte piece of it.
          if ($binary.Contains($endpoint)) {
            Check $true "the feed $endpoint is compiled in, whole"
          } else {
            $pieces = @(for ($i = 0; $i + 8 -le $endpoint.Length; $i += 8) { $endpoint.Substring($i, 8) }) + $endpoint.Substring($endpoint.Length - 8)
            $missing = @($pieces | Where-Object { -not $binary.Contains($_) })
            Check ($missing.Count -eq 0) "the feed $endpoint is compiled in, in 8-byte pieces (missing: $($missing -join ', '))"
          }
          Check ($binary.Contains('Could not fetch a valid release JSON from the remote')) "the updater plugin is linked (build.rs saw the key and the feed)"
          Check (-not ($binary -match 'github\.com/block/buzz(-app)?/releases')) "no Block update endpoint"
          Write-Output "info: the identifier $identifier appears in Buzz.exe whole: $($binary.Contains($identifier))"

          # A first start, for the record only: the app's data folders follow
          # the identifier. A runner may not show a window; nothing fails here.
          Write-Output "== A first start (information only)"
          $app = Start-Process $exe -PassThru
          Start-Sleep -Seconds 30
          Write-Output "running after 30 s: $(-not $app.HasExited)"
          foreach ($dir in @("$env:APPDATA\$identifier", "$env:LOCALAPPDATA\$identifier", "$env:APPDATA\xyz.block.buzz.desktop", "$env:LOCALAPPDATA\xyz.block.buzz.desktop", "$env:USERPROFILE\.buzz")) {
            Write-Output "$dir exists: $(Test-Path $dir)"
          }
          Get-Process | Where-Object { $_.Path -and $_.Path.StartsWith($dest, [StringComparison]::OrdinalIgnoreCase) } | ForEach-Object {
            Write-Output "stopping $($_.Path)"
            Stop-Process -Id $_.Id -Force
          }
          Start-Sleep -Seconds 5

          Write-Output "== The uninstaller"
          # _?= runs it in place and waits (NSIS otherwise copies it and returns).
          $process = Start-Process (Join-Path $dest 'uninstall.exe') -ArgumentList "/S _?=$dest" -Wait -PassThru
          Check ($process.ExitCode -eq 0) "uninstall.exe /S exited $($process.ExitCode)"
          Check (-not (Test-Path $exe)) "Buzz.exe removed"
          Check (-not (Test-Path -LiteralPath $uninstall)) "the uninstall entry removed"
          Check (-not (Test-Path -LiteralPath 'HKCU:\Software\Classes\buzz')) "the buzz:// scheme removed"
          Check (-not (Test-Path (Join-Path ([Environment]::GetFolderPath('Programs')) "$product.lnk"))) "the Start menu shortcut removed"
          $userPath = (Get-ItemProperty HKCU:\Environment).Path -split ';'
          Check (-not ($userPath -contains (Join-Path $dest 'bin'))) "the user PATH entry removed"
          # _?= keeps the uninstaller (and so its folder); nothing else may stay.
          $left = @(Get-ChildItem $dest -Recurse -File | ForEach-Object { $_.FullName.Substring($dest.Length + 1) })
          Check (($left.Count -eq 1) -and ($left[0] -eq 'uninstall.exe')) "the install folder holds only uninstall.exe (left: $($left -join ', '))"

          if ($fail.Count -gt 0) { throw "$($fail.Count) check(s) failed: $($fail -join '; ')" }
          Write-Output "verify: all checks passed"

      - name: Stage the installer and its checksum
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/cone-windows"
          mkdir -p "$out"
          cp "target/release/bundle/nsis/Cone_${VERSION}_x64-setup.exe" "$out/"
          printf '%s\n' "$GITHUB_SHA" > "$out/SOURCE_COMMIT"
          (cd "$out" && sha256sum Cone_*.exe > SHA256SUMS && cat SHA256SUMS)
          ls -l "$out"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cone-desktop-windows-x64-unsigned
          path: ${{ runner.temp }}/cone-windows
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build ${{ matrix.target }}
    needs: shallow
    if: >-
      always() &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/cone-desktop-v') && needs.shallow.result == 'success') ||
       (github.event_name == 'workflow_dispatch' && inputs.resume_run_id != '' && inputs.promote == '' && inputs.windows_check == ''))
    runs-on: macos-latest
    environment: cone-release
    timeout-minutes: 360
    permissions:
      contents: read
      actions: read # a resume reads the run it resumes and its artifacts
    strategy:
      # One target's failure must not cancel the other's notarization; the
      # release still needs both.
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            lipo: arm64
            dmg_arch: aarch64
          - target: x86_64-apple-darwin
            lipo: x86_64
            dmg_arch: x64
    env:
      TARGET: ${{ matrix.target }}
      LIPO_ARCH: ${{ matrix.lipo }}
      DMG_ARCH: ${{ matrix.dmg_arch }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fetch the pinned upstream tag from block/buzz-app
        run: |
          set -euo pipefail
          base="$(tr -d '[:space:]' < cone/UPSTREAM)"
          [[ "$base" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || { echo "::error::cone/UPSTREAM holds '$base', not a stable upstream tag vX.Y.Z"; exit 1; }
          git fetch --no-tags https://github.com/block/buzz-app.git "+refs/tags/$base:refs/tags/$base"

      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1

      - name: cone-shallow-check
        run: just cone-shallow-check

      - name: Version from the tag, and the tag on cone
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" == refs/tags/cone-desktop-v* ]] || { echo "::error::releases build from cone-desktop-v* tags only, not $GITHUB_REF"; exit 1; }
          VERSION="${GITHUB_REF_NAME#cone-desktop-v}"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::'$VERSION' is not SemVer"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/cone || { echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on cone"; exit 1; }
          # Apple's waits end 30 minutes before the job's 360 (verify, upload).
          {
            echo "VERSION=$VERSION"
            echo "STATE=$RUNNER_TEMP/cone-state"
            echo "CONE_NOTARY_DEADLINE=$(( $(date +%s) + 330 * 60 ))"
          } >> "$GITHUB_ENV"
          echo "Cone $VERSION from $GITHUB_SHA"

      # As upstream's desktop-build.yml: Hermit's rustup proxies select the
      # rust-toolchain.toml release with the runner's (Apple silicon) standard
      # library only; add the Intel one to that toolchain and keep nested
      # builds on it.
      - name: Pinned Rust with the Intel standard library
        if: matrix.dmg_arch == 'x64' && github.event_name == 'push'
        run: |
          version=$(rustc --version | cut -d' ' -f2)
          rustup toolchain install "$version" --profile minimal --target "$TARGET"
          echo "RUSTUP_TOOLCHAIN=$version" >> "$GITHUB_ENV"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      # A keychain of this run's own, with a password generated here, so the
      # helpers, the app and the DMG can be signed after Tauri.
      - name: Signing keychain and notarization key
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          umask 077
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          KEYCHAIN="$RUNNER_TEMP/cone-signing.keychain-db"
          P12="$RUNNER_TEMP/cone-signing.p12"
          printf '%s' "$APPLE_CERTIFICATE" | base64 --decode > "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -P "$APPLE_CERTIFICATE_PASSWORD" -f pkcs12 -k "$KEYCHAIN" -T /usr/bin/codesign
          rm -f "$P12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          read -r -a existing <<<"$(security list-keychains -d user | tr -d '"' | xargs)"
          security list-keychains -d user -s "$KEYCHAIN" "${existing[@]}"
          security find-identity -v -p codesigning "$KEYCHAIN" | grep -qF "\"$APPLE_SIGNING_IDENTITY\"" \
            || { echo "::error::APPLE_SIGNING_IDENTITY is not a valid identity in APPLE_CERTIFICATE"; exit 1; }
          printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/cone-notary.p8"
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/cone-notary.p8" >> "$GITHUB_ENV"

      # Tauri signs Contents/MacOS/Buzz and the bundle with the hardened
      # runtime and upstream's entitlements; cone/sign-nested.sh (inside the
      # recipe) then signs the helpers in Contents/Resources and the bundle
      # again. No notarization here (no APPLE_API_KEY/ISSUER): cone/notarize.sh
      # does it. TAURI_BUNDLER_DMG_IGNORE_CI lets the DMG's Finder layout run on
      # the runner. With the updater key Tauri also signs its own
      # Cone.app.tar.gz: only a proof that the key and password work.
      - name: Build and sign the app
        if: github.event_name == 'push'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          TAURI_BUNDLER_DMG_IGNORE_CI: 'true'
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: just cone-desktop-build "$TARGET" "$VERSION"

      - name: The build as the release's state
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          bundle="target/$TARGET/release/bundle"
          dmg="Cone_${VERSION}_${DMG_ARCH}.dmg"
          [[ -s "$bundle/macos/Cone.app.tar.gz.sig" ]] || { echo "::error::Tauri made no updater signature: is the updater key set?"; exit 1; }
          mkdir -p "$STATE"
          ditto -c -k --keepParent "$bundle/macos/Cone.app" "$STATE/Cone.zip"
          cp "$bundle/dmg/$dmg" "$STATE/tauri.dmg"
          echo "$dmg" > "$STATE/dmg"
          echo built > "$STATE/stage"

      # Each run saves two checkpoints under their own names, never
      # overwritten: -1 before Apple's waits, -2 after. A resume takes the
      # newest one the run has.
      - name: The run to resume
        id: source
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN: ${{ inputs.resume_run_id }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_RUN" =~ ^[0-9]+$ ]] || { echo "::error::resume_run_id '$SOURCE_RUN' is not a run id"; exit 1; }
          got="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" --jq '[.path, .head_branch, .head_sha] | join(" ")')"
          want=".github/workflows/cone-desktop.yml $GITHUB_REF_NAME $GITHUB_SHA"
          [[ "$got" == "$want" ]] || { echo "::error::run $SOURCE_RUN is '$got', not '$want'"; exit 1; }
          names="$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/artifacts" --jq '.artifacts[] | select(.expired | not) | .name')"
          artifact=""
          for n in 2 1; do
            if grep -qx "cone-state-$DMG_ARCH-$n" <<<"$names"; then artifact="cone-state-$DMG_ARCH-$n"; break; fi
          done
          [[ -n "$artifact" ]] || { echo "::error::run $SOURCE_RUN has no saved state for $DMG_ARCH"; exit 1; }
          echo "artifact=$artifact" >> "$GITHUB_OUTPUT"
          echo "resuming run $SOURCE_RUN ($GITHUB_REF_NAME at $GITHUB_SHA) from $artifact"

      # The updater archive is signed with upstream's Tauri CLI, which a resume
      # (no build) has not installed.
      - name: Node modules for the updater signer
        if: github.event_name == 'workflow_dispatch'
        run: pnpm install --frozen-lockfile

      - name: Download the state of the run to resume
        if: github.event_name == 'workflow_dispatch'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ steps.source.outputs.artifact }}
          path: ${{ runner.temp }}/cone-state
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}

      - name: Save checkpoint 1
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cone-state-${{ matrix.dmg_arch }}-1
          path: ${{ runner.temp }}/cone-state
          if-no-files-found: ignore
          retention-days: 14

      - name: Notarize the app and the DMG, staple both
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          echo "stage: $(cat "$STATE/stage")"
          rc=0
          cone/release-advance.sh "$STATE" || rc=$?
          if (( rc == 3 )); then
            echo "::error::Apple has not finished; the state is saved. Resume (the owner approves it): gh workflow run cone-desktop.yml -R $GITHUB_REPOSITORY --ref $GITHUB_REF_NAME -f resume_run_id=$GITHUB_RUN_ID"
          fi
          exit "$rc"

      - name: Save checkpoint 2
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cone-state-${{ matrix.dmg_arch }}-2
          path: ${{ runner.temp }}/cone-state
          if-no-files-found: ignore
          retention-days: 14

      - name: Unpack the stapled app
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/cone-verify"
          mkdir -p "$RUNNER_TEMP/cone-verify"
          ditto -x -k "$STATE/Cone.zip" "$RUNNER_TEMP/cone-verify"
          echo "APP=$RUNNER_TEMP/cone-verify/Cone.app" >> "$GITHUB_ENV"
          echo "DMG=$STATE/$(cat "$STATE/dmg")" >> "$GITHUB_ENV"

      - name: Verify the app and the DMG
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          plist="$APP/Contents/Info.plist"
          for k in CFBundleName CFBundleIdentifier CFBundleShortVersionString; do
            printf '%s = %s\n' "$k" "$(/usr/libexec/PlistBuddy -c "Print :$k" "$plist")"
          done
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$plist")" == digital.cone.desktop ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist")" == "$VERSION" ]]
          codesign --verify --deep --strict -vv "$APP"
          spctl --assess --type execute -vv "$APP"
          xcrun stapler validate "$APP"
          # Upstream's entitlements, as its release checks them.
          codesign --display --entitlements :- "$APP" > "$RUNNER_TEMP/cone-entitlements.plist" 2>/dev/null
          for e in com.apple.security.device.audio-input com.apple.security.cs.disable-library-validation; do
            [[ "$(/usr/libexec/PlistBuddy -c "Print :$e" "$RUNNER_TEMP/cone-entitlements.plist")" == true ]] || { echo "::error::the signed app lacks $e"; exit 1; }
          done
          # Every executable it carries: the app's and the helpers upstream
          # bundles as resources (the buzz CLI, buzz-agent-command, goose-acp).
          n=0
          while IFS= read -r -d '' bin; do
            file -b "$bin" | grep -q '^Mach-O' || continue
            info="$(codesign -dvv "$bin" 2>&1)"
            grep -qx "TeamIdentifier=$APPLE_TEAM_ID" <<<"$info" || { echo "::error::$bin: not signed by the team"; exit 1; }
            grep -q '^CodeDirectory .*flags=.*runtime' <<<"$info" || { echo "::error::$bin: no hardened runtime"; exit 1; }
            archs="$(lipo -archs "$bin")"
            [[ "$archs" == "$LIPO_ARCH" ]] || { echo "::error::$bin: $archs, not $LIPO_ARCH"; exit 1; }
            echo "${bin#"$APP/"}: team, hardened runtime, $archs"
            n=$((n + 1))
          done < <(find "$APP/Contents/MacOS" "$APP/Contents/Resources" -type f -print0)
          (( n >= 4 )) || { echo "::error::$n executables, expected the app and three helpers"; exit 1; }
          "$APP/Contents/Resources/bin/buzz" --help >/dev/null || { echo "::error::the signed buzz CLI does not run"; exit 1; }
          # The updater: Cone's key compiled in, Block's feeds not. The key and
          # the feed's URL come from one config delta, so the key proves the
          # delta; the URL is looked for where the compiler keeps it as one
          # literal (the x86_64 build stores it in 8-byte pieces: Slice 29
          # defect 237).
          endpoint="$(grep -E '^BUZZ_UPDATER_ENDPOINT=' cone/build.env | cut -d= -f2-)"
          strings -a "$APP/Contents/MacOS/Buzz" > "$RUNNER_TEMP/cone-strings.txt"
          grep -qF "$(tr -d '[:space:]' < cone/updater.pub)" "$RUNNER_TEMP/cone-strings.txt" || { echo "::error::cone/updater.pub's key is not in the app"; exit 1; }
          if [[ "$LIPO_ARCH" == arm64 ]]; then
            grep -qF "$endpoint" "$RUNNER_TEMP/cone-strings.txt" || { echo "::error::$endpoint is not in the app"; exit 1; }
            found="$endpoint and "
          fi
          ! grep -qE 'github\.com/block/buzz(-app)?/releases' "$RUNNER_TEMP/cone-strings.txt" || { echo "::error::Block's update endpoint is in the app"; exit 1; }
          echo "updater: ${found:-}cone/updater.pub's key compiled in; no Block endpoint"
          spctl --assess --type open --context context:primary-signature -vv "$DMG"
          xcrun stapler validate "$DMG"
          # What a person gets: the app inside the DMG, stapled, and Finder's
          # layout (.DS_Store) with cone/'s background.
          mnt="$RUNNER_TEMP/cone-dmg-check"
          mkdir -p "$mnt"
          hdiutil attach "$DMG" -nobrowse -readonly -noautoopen -mountpoint "$mnt" >/dev/null
          trap 'hdiutil detach "$mnt" >/dev/null || true' EXIT
          ls -la "$mnt" "$mnt/.background"
          codesign --verify --deep --strict "$mnt/Cone.app"
          xcrun stapler validate "$mnt/Cone.app"
          [[ -s "$mnt/.DS_Store" ]] || { echo "::error::the DMG has no Finder layout (.DS_Store)"; exit 1; }
          cmp -s "$mnt/.background/$(ls "$mnt/.background")" cone/icons/dmg-background.png \
            || { echo "::error::the DMG's background is not cone/icons/dmg-background.png"; exit 1; }
          echo "Finder layout present; background = cone/icons/dmg-background.png"
          shasum -a 256 "$DMG"

      # Tauri's own archive predates the ticket; this one is the stapled app.
      - name: The updater archive from the stapled app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          files="$RUNNER_TEMP/cone-release-files"
          rm -rf "$files"
          cone/updater-archive.sh "$STATE" "$files" "$VERSION" "$DMG_ARCH"
          cp "$DMG" "$files/"
          ls -l "$files"
          echo "RELEASE_FILES=$files" >> "$GITHUB_ENV"

      - name: Remove the signing keychain and the notarization key
        if: always()
        # Fixed paths, not $KEYCHAIN: a setup step that failed after creating
        # the keychain never wrote it to GITHUB_ENV.
        run: |
          keychain="$RUNNER_TEMP/cone-signing.keychain-db"
          if [[ -e "$keychain" ]]; then security delete-keychain "$keychain" || true; fi
          rm -f "$RUNNER_TEMP/cone-notary.p8" "$RUNNER_TEMP/cone-signing.p12"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cone-desktop-${{ matrix.dmg_arch }}
          path: ${{ env.RELEASE_FILES }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: GitHub Release
    needs: build
    # always(): a resume skips `shallow` by design, and a job whose ancestor
    # was skipped is skipped too unless its condition says otherwise — the
    # 2.1.0 resume notarized both builds and published nothing (Slice 51).
    # needs.build.result is 'success' only when every matrix target succeeded.
    if: >-
      always() && needs.build.result == 'success' &&
      startsWith(github.ref, 'refs/tags/cone-desktop-v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: cone-desktop-*
          merge-multiple: true
          path: dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#cone-desktop-v}"
          UPSTREAM="$(tr -d '[:space:]' < cone/UPSTREAM)"
          for arch in aarch64 x64; do
            ls "dist/Cone_${VERSION}_${arch}.dmg" "dist/Cone_${VERSION}_${arch}.app.tar.gz" "dist/Cone_${VERSION}_${arch}.app.tar.gz.sig"
          done
          (cd dist && sha256sum ./*.dmg ./*.app.tar.gz > SHA256SUMS && cat SHA256SUMS)
          pre=()
          if [[ "$VERSION" == *-* ]]; then pre=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/*.app.tar.gz dist/*.app.tar.gz.sig dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag ${pre[@]+"${pre[@]}"} \
            --title "Cone $VERSION" \
            --notes "Cone Desktop $VERSION, built from block/buzz-app $UPSTREAM ($GITHUB_SHA). Signed with Cone's Developer ID and notarized by Apple; Apple silicon (aarch64) and Intel (x64), each with its signed updater archive. Installed apps update to it once it is promoted."

  # Publishes a release to installed apps: its archives verified against
  # cone/updater.pub as an app verifies them, latest.json written, uploaded to
  # the bucket object 2/latest.json with the bucket-scoped token, and read
  # back through the feed. The owner approves it like every cone-release run.
  # One promotion at a time across all tags, and each refuses to move the feed
  # to an older version than the bucket holds or to write any other object
  # (cone/promote-check.sh). The old app's feed is read before and after and
  # must not change by a byte.
  promote:
    name: Promote ${{ inputs.promote }}
    if: github.event_name == 'workflow_dispatch' && inputs.promote != '' && inputs.resume_run_id == '' && inputs.windows_check == ''
    runs-on: ubuntu-latest
    environment: cone-release
    concurrency:
      group: cone-desktop-feed-2
      cancel-in-progress: false
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.promote }}
      FEED_URL: https://buzz.cone.digital/desktop/2/latest.json
      OLD_FEED_URL: https://buzz.cone.digital/desktop/latest.json
      FEED_BUCKET: cone-desktop-updates
      FEED_OBJECT: 2/latest.json
      RCLONE_IMAGE: rclone/rclone:1.75.1@sha256:45401ad7410db1d67ffdb58e19059ad20b0d8e0285a60e38bbec55cc1019c7a5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: The release and its archives, verified
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^cone-desktop-v([0-9]+\.[0-9]+\.[0-9]+)$ ]] || { echo "::error::promote takes a release tag cone-desktop-vX.Y.Z, not '$TAG'"; exit 1; }
          VERSION="${BASH_REMATCH[1]}"
          [[ "$VERSION" == 2.* ]] || { echo "::error::$TAG is not on this app's 2.x line"; exit 1; }
          git merge-base --is-ancestor "$TAG^{commit}" origin/cone || { echo "::error::$TAG is not on cone"; exit 1; }
          draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
          [[ "$draft" == false ]] || { echo "::error::$TAG is a draft"; exit 1; }
          mkdir -p dist
          for arch in aarch64 x64; do
            gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist \
              --pattern "Cone_${VERSION}_${arch}.app.tar.gz" --pattern "Cone_${VERSION}_${arch}.app.tar.gz.sig"
          done
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist --pattern SHA256SUMS
          (cd dist && grep -E '\.app\.tar\.gz$' SHA256SUMS | sha256sum -c -)
          for arch in aarch64 x64; do
            cone/updater-verify.sh "dist/Cone_${VERSION}_${arch}.app.tar.gz" "dist/Cone_${VERSION}_${arch}.app.tar.gz.sig" cone/updater.pub
          done
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "UPSTREAM=$(git show "$TAG:cone/UPSTREAM" | tr -d '[:space:]')" >> "$GITHUB_ENV"

      # Tauri's static updater manifest: each platform's signature is the
      # .sig file's text, its URL the release asset.
      - name: latest.json
        run: |
          set -euo pipefail
          url="https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG"
          jq -n --arg v "$VERSION" --arg notes "Cone $VERSION (block/buzz-app $UPSTREAM)" \
                --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                --rawfile sa "dist/Cone_${VERSION}_aarch64.app.tar.gz.sig" \
                --rawfile sx "dist/Cone_${VERSION}_x64.app.tar.gz.sig" \
                --arg ua "$url/Cone_${VERSION}_aarch64.app.tar.gz" \
                --arg ux "$url/Cone_${VERSION}_x64.app.tar.gz" \
            '{version: $v, notes: $notes, pub_date: $date,
              platforms: {"darwin-aarch64": {signature: ($sa | rtrimstr("\n")), url: $ua},
                          "darwin-x86_64":  {signature: ($sx | rtrimstr("\n")), url: $ux}}}' > latest.json
          jq -e --arg v "$VERSION" '.version == $v and (.platforms | keys) == ["darwin-aarch64", "darwin-x86_64"]
            and ([.platforms[].signature | length > 0] | all)' latest.json >/dev/null
          cat latest.json

      - name: Upload to the feed
        env:
          CONE_R2_ACCESS_KEY_ID: ${{ secrets.CONE_R2_ACCESS_KEY_ID }}
          CONE_R2_SECRET_ACCESS_KEY: ${{ secrets.CONE_R2_SECRET_ACCESS_KEY }}
          CONE_R2_ENDPOINT: ${{ secrets.CONE_R2_ENDPOINT }}
        run: |
          set -euo pipefail
          old_before="$(curl -fsS "$OLD_FEED_URL" | sha256sum | cut -d' ' -f1)"
          echo "old app's feed before: $old_before"
          # The token reaches rclone through a 0600 env file, not the command line.
          envfile="$RUNNER_TEMP/cone-feed.env"
          ( umask 077
            printf 'RCLONE_CONFIG=/dev/null\nRCLONE_CONFIG_FEED_TYPE=s3\nRCLONE_CONFIG_FEED_PROVIDER=Cloudflare\nRCLONE_CONFIG_FEED_NO_CHECK_BUCKET=true\n'
            printf 'RCLONE_CONFIG_FEED_ENDPOINT=%s\n' "$CONE_R2_ENDPOINT"
            printf 'RCLONE_CONFIG_FEED_ACCESS_KEY_ID=%s\n' "$CONE_R2_ACCESS_KEY_ID"
            printf 'RCLONE_CONFIG_FEED_SECRET_ACCESS_KEY=%s\n' "$CONE_R2_SECRET_ACCESS_KEY" ) > "$envfile"
          trap 'rm -f "$envfile"' EXIT
          feed_rclone() { docker run --rm --env-file "$envfile" -v "$PWD:/work" -w /work "$RCLONE_IMAGE" "$@"; }
          # What the object holds now, read from the bucket itself; a listing
          # or a read that fails stops the promotion.
          : > previous.json
          listing="$(feed_rclone lsf "FEED:$FEED_BUCKET/${FEED_OBJECT%/*}/")"
          if grep -qx "${FEED_OBJECT##*/}" <<<"$listing"; then
            feed_rclone cat "FEED:$FEED_BUCKET/$FEED_OBJECT" > previous.json
            echo "feed before: $(sha256sum previous.json | cut -d' ' -f1) (version $(jq -r '.version // "none"' previous.json 2>/dev/null || echo unreadable))"
          else
            echo "feed before: no $FEED_OBJECT in the bucket"
          fi
          cone/promote-check.sh previous.json "$VERSION" "$FEED_OBJECT"
          feed_rclone copyto /work/latest.json "FEED:$FEED_BUCKET/$FEED_OBJECT" --header-upload "Cache-Control: no-cache"
          want="$(sha256sum latest.json | cut -d' ' -f1)"
          for _ in $(seq 1 12); do
            got="$(curl -fsS "$FEED_URL" | sha256sum | cut -d' ' -f1 || true)"
            [[ "$got" == "$want" ]] && break
            sleep 5
          done
          [[ "$got" == "$want" ]] || { echo "::error::$FEED_URL serves $got, not the uploaded $want"; exit 1; }
          echo "feed after:  $want — Cone $VERSION promoted ($FEED_URL)"
          old_after="$(curl -fsS "$OLD_FEED_URL" | sha256sum | cut -d' ' -f1)"
          [[ "$old_after" == "$old_before" ]] || { echo "::error::the old app's feed changed: $old_before → $old_after"; exit 1; }
          echo "old app's feed after:  $old_after (unchanged)"
